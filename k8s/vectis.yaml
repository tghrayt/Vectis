apiVersion: v1
kind: Namespace
metadata:
  name: vectis
---
apiVersion: v1
kind: Service
metadata:
  name: vectis-db
  namespace: vectis
spec:
  selector:
    app: vectis-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vectis-db
  namespace: vectis
spec:
  serviceName: vectis-db
  replicas: 1
  selector:
    matchLabels:
      app: vectis-db
  template:
    metadata:
      labels:
        app: vectis-db
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: vectis
            - name: POSTGRES_USER
              value: vectis
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - vectis
                - -d
                - vectis
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - vectis
                - -d
                - vectis
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vectis-web
  namespace: vectis
spec:
  selector:
    app: vectis-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectis-web
  namespace: vectis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vectis-web
  template:
    metadata:
      labels:
        app: vectis-web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vectis-web
          image: docker.io/library/vectis-app:__IMAGE_TAG__
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Logging__LogLevel__Default
              value: Information
            - name: Logging__LogLevel__Microsoft.AspNetCore
              value: Warning
            - name: ConnectionStrings__Vectis
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: CONNECTION_STRING
            - name: Smtp__Enabled
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: SMTP_ENABLED
            - name: Smtp__Host
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: SMTP_HOST
            - name: Smtp__Port
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: SMTP_PORT
            - name: Smtp__UserName
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: SMTP_USERNAME
            - name: Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: SMTP_PASSWORD
            - name: Smtp__FromEmail
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: SMTP_FROM_EMAIL
            - name: Smtp__FromName
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: SMTP_FROM_NAME
            - name: Smtp__EnableSsl
              valueFrom:
                secretKeyRef:
                  name: vectis-secrets
                  key: SMTP_ENABLE_SSL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vectis-web
  namespace: vectis
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - __APP_HOST__
      secretName: vectis-web-tls
  rules:
    - host: __APP_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vectis-web
                port:
                  number: 80
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vectis-db-backup
  namespace: vectis
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: vectis-db-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-backup
              image: postgres:16
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vectis-secrets
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  mkdir -p /backups
                  file="/backups/vectis-$(date -u +%Y%m%d-%H%M%S).sql.gz"
                  pg_dump -h vectis-db -U vectis -d vectis | gzip > "$file"
                  find /backups -type f -name 'vectis-*.sql.gz' -mtime +14 -delete
                  ls -lh "$file"
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backups
              hostPath:
                path: /opt/vectis/backups
                type: DirectoryOrCreate
