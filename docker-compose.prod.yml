services:
  vectis-db:
    image: postgres:16
    container_name: vectis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vectis
      POSTGRES_USER: vectis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vectis_postgres_data:/var/lib/postgresql/data
    networks:
      - vectis

  vectis-web:
    image: vectis-app:${IMAGE_TAG:-latest}
    container_name: vectis-web
    restart: unless-stopped
    depends_on:
      - vectis-db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Vectis: Host=vectis-db;Port=5432;Database=vectis;Username=vectis;Password=${POSTGRES_PASSWORD}
      Smtp__Enabled: ${SMTP_ENABLED:-false}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UserName: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Vectis}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - vectis

volumes:
  vectis_postgres_data:

networks:
  vectis:
    name: vectis
