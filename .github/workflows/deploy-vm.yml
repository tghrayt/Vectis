name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vectis-production
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet run --configuration Release --project tests/Vectis.Tests

      - name: Build Docker image
        run: docker build --pull -t vectis-app:${{ github.sha }} -t vectis-app:latest .

      - name: Save Docker image
        run: docker save vectis-app:${{ github.sha }} vectis-app:latest | gzip > vectis-app.tar.gz

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.VM_SSH_KEY_B64 }}" ]; then
            echo "::error::Le secret VM_SSH_KEY_B64 est vide ou absent."
            exit 1
          fi
          printf '%s' "${{ secrets.VM_SSH_KEY_B64 }}" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -p "${{ secrets.VM_PORT }}" "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          ssh -p "${{ secrets.VM_PORT }}" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "sudo mkdir -p /opt/vectis && sudo chown ${{ secrets.VM_USER }}:${{ secrets.VM_USER }} /opt/vectis"
          ssh -p "${{ secrets.VM_PORT }}" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "sudo mkdir -p /opt/vectis/backups && sudo chown 999:999 /opt/vectis/backups && sudo chmod 0770 /opt/vectis/backups"
          scp -P "${{ secrets.VM_PORT }}" vectis-app.tar.gz "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/vectis/"
          scp -P "${{ secrets.VM_PORT }}" -r k8s "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/vectis/"

      - name: Deploy on VM
        run: |
          ssh -p "${{ secrets.VM_PORT }}" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" << 'EOF'
          set -euo pipefail
          cd /opt/vectis

          docker rm -f vectis-proxy vectis-web vectis-db >/dev/null 2>&1 || true

          gunzip -f vectis-app.tar.gz
          sudo k3s ctr -n k8s.io images import vectis-app.tar
          rm -f vectis-app.tar

          if ! sudo k3s kubectl get namespace cert-manager >/dev/null 2>&1; then
            sudo k3s kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml
            sudo k3s kubectl -n cert-manager rollout status deployment/cert-manager --timeout=180s
            sudo k3s kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=180s
            sudo k3s kubectl -n cert-manager rollout status deployment/cert-manager-cainjector --timeout=180s
          fi

          sudo k3s kubectl apply -f k8s/cert-manager/cluster-issuer.yaml

          sudo k3s kubectl create namespace vectis --dry-run=client -o yaml | sudo k3s kubectl apply -f -
          sudo k3s kubectl -n vectis create secret generic vectis-secrets \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=CONNECTION_STRING='Host=vectis-db;Port=5432;Database=vectis;Username=vectis;Password=${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=SMTP_ENABLED='${{ vars.SMTP_ENABLED || 'false' }}' \
            --from-literal=SMTP_HOST='${{ secrets.SMTP_HOST }}' \
            --from-literal=SMTP_PORT='${{ vars.SMTP_PORT || '587' }}' \
            --from-literal=SMTP_USERNAME='${{ secrets.SMTP_USERNAME }}' \
            --from-literal=SMTP_PASSWORD='${{ secrets.SMTP_PASSWORD }}' \
            --from-literal=SMTP_FROM_EMAIL='${{ secrets.SMTP_FROM_EMAIL }}' \
            --from-literal=SMTP_FROM_NAME='${{ vars.SMTP_FROM_NAME || 'Vectis' }}' \
            --from-literal=SMTP_ENABLE_SSL='${{ vars.SMTP_ENABLE_SSL || 'true' }}' \
            --dry-run=client -o yaml | sudo k3s kubectl apply -f -

          sed \
            -e 's#__IMAGE_TAG__#${{ github.sha }}#g' \
            -e 's#__APP_HOST__#${{ vars.APP_HOST || 'vectis.51-210-40-78.sslip.io' }}#g' \
            k8s/vectis.yaml > k8s/vectis.rendered.yaml
          sudo k3s kubectl apply -f k8s/vectis.rendered.yaml

          sudo k3s kubectl -n vectis rollout restart deployment/vectis-web
          sudo k3s kubectl -n vectis rollout status deployment/vectis-web --timeout=240s
          sudo k3s kubectl -n vectis get ingress,svc,pods,cronjob
          EOF

      - name: Smoke test
        run: |
          for attempt in {1..18}; do
            if curl --fail --show-error --max-time 20 "https://${{ vars.APP_HOST || 'vectis.51-210-40-78.sslip.io' }}/health/ready"; then
              exit 0
            fi
            echo "Waiting for HTTPS health check... attempt ${attempt}/18"
            sleep 10
          done
          exit 1
